[project]
name = "x"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
addopts = "-s"
DJANGO_SETTINGS_MODULE = "config.settings"
