[project]
name = "x"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-datadir>=1.8.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s"
DJANGO_SETTINGS_MODULE = "config.settings"
